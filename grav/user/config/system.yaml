# ============================================================
# Konfigurasi Sistem Grav — Produk Perpustakaan Digital Sekolah
# ============================================================

absolute_urls: false
param_sep: ':'
wrapped_site: false
reverse_proxy_setup: false
force_ssl: false
force_lowercase_urls: true
custom_base_url: null
username_regex: '^[a-z0-9_-]{3,16}$'
pwd_regex: '(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}'
intl_enabled: true
http_x_forwarded:
  protocols: true
  hosts: true
languages:
  supported:
    - id
  default_lang: id
  include_default_lang: false
  pages_fallback_only: true
  translations: true
  translations_fallback: true
  session_store_active: false
  http_accept_language: false
  override_locale: false
home:
  alias: /beranda
  hide_in_urls: true
pages:
  theme: perpus
  order:
    by: default
    dir: asc
  list:
    count: 12
  dateformat:
    default: 'd-m-Y H:i'
    short: 'd-m-Y'
    long: 'd F Y H:i'
  publish_dates: true
  process:
    markdown: true
    twig: true
  twig_first: false
  never_cache_twig: false
  events:
    page: true
    twig: true
  markdown:
    extra: true
    auto_line_breaks: false
    auto_url_links: false
    escape_markup: false
    special_chars:
      '>': gt
      '<': lt
  markdown_extra: true
  type: html
  append_url_extension: null
  expires: 604800
  last_modified: false
  etag: true
  conditional_etag: false
  inline_css_minify: true
  inline_js_minify: true
  assets:
    css_pipeline: false
    js_pipeline: false
    css_minify: true
    js_minify: true
    css_rewrite: true
  redirect_default_route: false
  redirect_default_code: 302
  redirect_trailing_slash: true
  ignore_files:
    - .DS_Store
  ignore_folders:
    - .git
    - .idea
  ignore_hidden: true
  hide_empty_folders: false
  url_taxonomy_filters: true
  frontmatter:
    process_twig: false
    ignore_fields:
      - form
      - form_name
cache:
  enabled: true
  check:
    method: file
  driver: auto
  prefix: g
  purge_at: '0 4 * * *'
  clear_at: '0 3 * * *'
  clear_job_type: standard
  clear_images_by_default: false
  cli_compatibility: false
  lifetime: 604800
  gzip: true
  allow_webserver_gzip: false
  redis:
    socket: null
twig:
  cache: true
  debug: true
  auto_reload: true
  autoescape: false
  undefined_functions: true
  undefined_filters: true
  umask_fix: false
assets:
  css_pipeline: false
  css_pipeline_include_externals: true
  css_pipeline_before_excludes: true
  css_minify: true
  css_minify_windows: false
  css_rewrite: true
  js_pipeline: false
  js_pipeline_include_externals: true
  js_pipeline_before_excludes: true
  js_minify: true
  enable_asset_timestamp: true
  collections:
    jquery: 'system://assets/jquery/jquery-2.x.min.js'
errors:
  display: 0
  log: true
log:
  handler: file
  filename: grav.log
  level: notice
debugger:
  enabled: false
  shutdown:
    close_connection: true
  twig: true
images:
  default_image_quality: 85
  cache_all: false
  cache_perms: '0755'
  debug: false
  auto_fix_orientation: false
  seofriendly: false
media:
  enable_media_timestamp: false
  unsupported_inline_types: []
  allowed_fallback_types: []
  auto_metadata_exif: false
  upload_limit: 104857600
session:
  enabled: true
  timeout: 1800
  name: grav-site
  secure: false
  httponly: true
  split: true
  path: null
strict_mode:
  yaml_compat: true
  twig_compat: true
  blueprint_compat: true
