# ============================================================
# Override untuk pengembangan/instalasi di PC LOKAL
# Otomatis dipakai oleh `docker compose up` di mesin lokal,
# TIDAK digunakan oleh Easypanel (Easypanel hanya membaca
# docker-compose.yml — file ini tidak ikut di-deploy).
#
# Kegunaan: memetakan port container agar bisa diakses dari
# browser PC lokal tanpa perlu reverse proxy.
# ============================================================

services:
  grav:
    ports:
      - "8080:80"   # website:  http://localhost:8080

  slims:
    ports:
      - "8082:80"   # OPAC:     http://localhost:8082

  db:
    ports:
      - "13306:3306" # (opsional) akses MySQL langsung dari PC
